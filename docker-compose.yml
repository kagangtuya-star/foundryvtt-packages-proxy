version: '3.8'

services:
  fvtt-proxy:
    build: .
    container_name: fvtt-proxy-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Mount custom config file (创建一个 config.yaml 再挂载)
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - NODE_ENV=production
      - PORT=3000
      # 强制绑定到所有接口，解决 Docker 网络问题
      - HOST=0.0.0.0
      # 设置公开访问的 URL
      # - PUBLIC_URL=https://your-domain.com
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Resource limits (adjust as needed)
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
